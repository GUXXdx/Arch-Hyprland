name: Script-tests

run-name: ${{ github.actor }} is testing out GitHub Actions 🚀
on: [push]
jobs:
  Test-install:
    name: Test install
    runs-on: ubuntu-latest
    steps:


      # Step 1 Run container in background
      - name: Start container
        run: docker run --name Arch-btw -d -v ${{ github.workspace }}:/workspace guxxdx/archguxx:1.0

      # Step 2: Make the script executable
      - name: Make install.sh executable
        run: docker exec Arch-btw chmod +x /workspace/install.sh

      # Step 3: Run the install script
      - name: Run install.sh
        run: docker exec Arch-btw /workspace/install.sh -a
